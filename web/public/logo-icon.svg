<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Fills work reliably in MuPDF) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="apertureGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <!-- Emerald Center Spark Fill -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Chassis -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="124" fill="none" stroke="#00D2FF" stroke-width="6"/>

  <!-- Inner Ambient Atmospheric Glow -->
  <circle cx="256" cy="256" r="190" fill="url(#apertureGlow)"/>

  <!-- Storage Platter Concentric Track Telemetry (Burrow Rings) -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" stroke-dasharray="6 14"/>
  <circle cx="256" cy="256" r="118" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="2"/>

  <!-- Precision Sector Markers (0, 90, 180, 270 deg) -->
  <line x1="256" y1="52" x2="256" y2="72" stroke="#00D2FF" stroke-width="4" stroke-linecap="round"/>
  <line x1="460" y1="256" x2="440" y2="256" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="460" x2="256" y2="440" stroke="#4F46E5" stroke-width="4" stroke-linecap="round"/>
  <line x1="52" y1="256" x2="72" y2="256" stroke="#00D2FF" stroke-width="4" stroke-linecap="round"/>

  <!-- Outer Heavy Platter Sector Sweep (300 degree power arc) -->
  <path d="M 140 372 A 166 166 0 1 1 396 320" 
        fill="none" 
        stroke="#00D2FF" 
        stroke-width="28" 
        stroke-linecap="round"/>

  <!-- Inner Concentric Vault Arc -->
  <path d="M 148 188 A 122 122 0 0 1 364 212" 
        fill="none" 
        stroke="#6366F1" 
        stroke-width="18" 
        stroke-linecap="round" 
        opacity="0.9"/>

  <!-- The Interlocking "W" Warren Vector (Dynamic Storage Fold & Clean Wings) -->
  <path d="M 148 244 L 202 362 L 256 270 L 310 362 L 364 244" 
        fill="none" 
        stroke="#38BDF8" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Central Apex Upward Reclaim Triangle Fill (Subtle Tech Shield) -->
  <polygon points="256,220 292,274 220,274" fill="rgba(0, 210, 255, 0.22)"/>

  <!-- The Core Reclaim Spark (Emerald 4-Point Star Aperture) -->
  <circle cx="256" cy="226" r="22" fill="#10B981" opacity="0.35"/>
  <path d="M 256 196 Q 256 226 286 226 Q 256 226 256 256 Q 256 226 226 226 Q 256 226 256 196 Z" 
        fill="url(#emeraldGrad)"/>
  <circle cx="256" cy="226" r="4.5" fill="#FFFFFF"/>

  <!-- Accent Status Light Micro-Node -->
  <circle cx="396" cy="320" r="7" fill="#00D2FF"/>
</svg>
